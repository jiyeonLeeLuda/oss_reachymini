<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Reachy Mini Peekaboo</title>
	<link rel="stylesheet" href="style.css" />
</head>

<body>
	<div class="hero">
		<div class="hero-content">
			<div class="app-icon">🙈</div>
			<h1>Reachy Mini Peekaboo</h1>
			<p class="tagline">숨었다가 "까꿍!" 하고 랜덤하게 좌우로 갸웃하는 귀여운 동작</p>
		</div>
	</div>

	<div class="container">
		<div class="main-card">
			<h2>어떻게 동작하나요?</h2>
			<ol class="steps">
				<li>머리를 완전히 숙여 <b>숨습니다</b> (전원 OFF 자세).</li>
				<li>잠깐 랜덤하게 기다린 뒤 <b>"까꿍!"</b> 하고 고개를 듭니다.</li>
				<li>올라올 때마다 <b>랜덤으로 왼쪽/오른쪽</b>으로 고개를 갸웃합니다.</li>
				<li>잠깐 쳐다본 뒤 다시 숨습니다. (반복)</li>
			</ol>
			<p class="note">소리 감지를 쓰지 않는 타이머 기반 동작이라 마이크 없이도 잘 동작합니다.</p>
		</div>
	</div>

	<div class="footer">
		<p>
			🙈 Reachy Mini Peekaboo •
			<a href="https://huggingface.co/spaces?q=reachy_mini" target="_blank">Reachy Mini Apps</a>
		</p>
	</div>
</body>

</html>
